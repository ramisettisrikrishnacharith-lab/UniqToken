name: WASM Playground

on:
  push:
    branches: [main, master]
    paths:
      - crates/uniqtoken_core/**
      - docs/playground/**
      - .github/workflows/wasm-playground.yml
  pull_request:
    branches: [main, master]
    paths:
      - crates/uniqtoken_core/**
      - docs/playground/**
      - .github/workflows/wasm-playground.yml

permissions:
  contents: read

concurrency:
  group: wasm-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Clippy (wasm target)
        run: cargo clippy --manifest-path crates/uniqtoken_core/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features wasm -- -D warnings

      - name: Rust unit tests (wasm feature)
        run: cargo test --manifest-path crates/uniqtoken_core/Cargo.toml --features wasm

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build web bundle
        run: wasm-pack build crates/uniqtoken_core --target web --out-dir ../../docs/playground/pkg --no-pack -- --no-default-features --features wasm

      - name: Enforce 1.5 MiB wasm budget
        run: |
          wasm=docs/playground/pkg/uniqtoken_core_bg.wasm
          size=$(stat -c%s "$wasm")
          echo "wasm bundle bytes: $size"
          test "$size" -lt 1572864

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/playground

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
